<!DOCTYPE html>
<html lang="es">
<head>
    
    
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Art & Print | Diseño y Papelería</title>
    
        <!-- Google Fonts precargado de forma asíncrona no bloqueante -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Open+Sans:wght@400;600;700;800&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Open+Sans:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
        <noscript>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Open+Sans:wght@400;600;700;800&display=swap">
        </noscript>

        <!-- Preload de la imagen LCP con alta prioridad -->
        <link rel="preload" as="image" href="/mancha.webp" type="image/webp" fetchpriority="high">

        <!-- Descripción para Google -->
        <meta name="description"
            content="Diseño gráfico, papelería creativa y personalizada en el Centro Histórico de la CDMX. Tarjetas, invitaciones y más.">
    
        <!-- Metaetiquetas para WhatsApp, Facebook y LinkedIn (Open Graph) -->
        <meta property="og:title" content="Art & Print - Papeleria Social">
        <meta property="og:description"
            content="¡Visítanos! Papelería creativa, diseño e impresión en el corazón de la CDMX.">
        <meta property="og:image" content="https://artandprint.netlify.app/logo-share.jpg">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:url" content="https://artandprint.netlify.app/">
        <meta property="og:type" content="website">
    
        <!-- Icono de pestaña (Favicon) -->
        <link rel="icon" type="image/svg+xml" href="/nombre.webp">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
</head>
<body>

    <!-- Simulación de pantalla de celular (Semántica landmark <main> para accesibilidad) -->
    <main class="mobile-screen">

        <!-- ========= ZONA SUPERIOR: LOGO PARALLAX ========= -->
        <div class="top-section">
            <div id="logo-parallax-scene">
                <!-- Rutas para VITE (desde /public) con dimensiones y fetchpriority para LCP y CLS -->
                <div class="layer" data-depth="0.10"><img src="/mancha.webp" alt="Fondo decorativo de acuarela" width="500" height="500" fetchpriority="high"></div>
                <div class="layer" data-depth="0.15"><img src="/aro2.webp" alt="Aro decorativo exterior" width="500" height="500"></div>
                <div class="layer" data-depth="0.25"><img src="/aro1.webp" alt="Aro decorativo dorado" width="500" height="500"></div>
                <div class="layer" data-depth="0.40"><img src="/flores.webp" alt="Flores decorativas" width="500" height="500"></div>
                <div class="layer" data-depth="0.60"><img src="/nombre.webp" alt="Art & Print Logo" width="500" height="500"></div>
            </div>
        </div>

        <!-- ========= ZONA INFERIOR: PANEL DE VIDRIO ========= -->
        <div class="bottom-sheet">
            <div class="sheet-content">
                
                <div class="drag-handle"></div> <!-- Decoración visual -->

                <div class="header-text">
                    <h2>CONTÁCTANOS</h2>
                    <p>Diseño y papelería creativa</p>
                </div>

                <nav class="links-grid">
                    <a href="https://wa.me/525540760973?text=Hola,%20vi%20tu%20página%20y%20quiero%20más%20información." target="_blank" class="btn btn-whatsapp">
                        WHATSAPP
                    </a>

                    <a href="https://www.google.com/maps/dir//Plaza+Gala,+Rep%C3%BAblica+de+Brasil+24-Local+No.+9,+Centro+Hist%C3%B3rico+de+la+Cdad.+de+M%C3%A9xico,+Centro,+Cuauht%C3%A9moc,+06000+Cuauht%C3%A9moc,+CDMX/@19.4368524,-99.1749669,13z/data=!4m9!4m8!1m0!1m5!1m1!1s0x85d1f9c24e8ff229:0x8a6602d8d6cc941e!2m2!1d-99.1337667!2d19.4367811!3e0?entry=ttu&g_ep=EgoyMDI1MDYxNy4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="btn btn-maps">
                        UBICACIÓN
                    </a>

                    <a href="https://artandprint.netlify.app/" target="_blank" class="btn btn-web">
                        NUESTRA PÁGINA
                    </a>
                </nav>

                <footer class="info-footer">
                    <div class="horario-box">
                        <span>HORARIO DE ATENCIÓN</span>
                        <strong>LUNES A SÁBADO</strong>
                        <span>11:00 A 24:00 HRS.</span>
                    </div>
                </footer>

            </div>
        </div>

        

    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
